name: 採集價格

on:
  schedule:
    # 每 6 小時一班。GitHub 的 cron 在整點高峰會延遲甚至跳過，
    # 因此刻意錯開到 :17，並且程式本身設計為冪等可補跑。
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      keywords:
        description: "臨時關鍵字（逗號分隔），留白則使用 watchlist.json"
        required: false
  repository_dispatch:
    # 前端「加入追蹤」用這個事件觸發，免伺服器
    types: [track-product]
  push:
    # 改了採集清單或採集邏輯就立刻跑一班，不用等下一個 6 小時。
    # 這同時也是全新 repo 的自舉路徑：第一次 push 就會建出 data 分支
    # 並把網站部署起來，不需要任何手動步驟。
    branches: [main]
    paths:
      - "watchlist.json"
      - "collector/**"
      - "web/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  # 同一時間只跑一輪。排隊而非取消 —— 取消掉的那輪資料就永久缺一格了。
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 故障隔離：任一平台掛掉不影響其他平台的資料更新。
      # 這是「零當機」的真正來源 —— 隔離故障，而非預防故障。
      fail-fast: false
      max-parallel: 1          # 序列執行，避免多個 job 同時 push 撞車
      matrix:
        platform: [pchome]     # 接通新平台後往這裡加，程式碼不用改

    steps:
      # 主 checkout 拿的是程式碼。資料放在另一個 worktree，
      # 兩者分開才能各自 commit 到各自的分支。
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 離線測試
        # 比對層壞掉會靜默產生錯誤的指紋，那比採集失敗更難發現。
        # 這裡刻意不加 `|| true`：測試紅了就不該讓它去寫資料。
        run: |
          python tests/test_normalize.py
          python tests/test_browser.py
          python tests/test_storage.py
          python tests/test_watchlist.py

      - name: 準備 data 分支工作區
        # data 分支不存在時自動建立孤兒分支 —— 全新的 repo 第一次跑
        # 就能成功，不需要任何手動 bootstrap。
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git worktree add -B data databr origin/data
          else
            echo "data 分支尚未存在，建立孤兒分支"
            git worktree add --detach databr HEAD
            git -C databr checkout --orphan data
            git -C databr rm -rf --quiet . >/dev/null 2>&1 || true
          fi
          mkdir -p databr/data

      - name: 採集 ${{ matrix.platform }}
        id: collect
        env:
          # config.py 讀這個環境變數，因此程式完全不需要知道
          # 自己正在寫進另一個分支的 worktree。
          PRICEPORT_DATA: ${{ github.workspace }}/databr/data
        run: |
          python -m collector.run \
            --platform ${{ matrix.platform }} \
            ${{ github.event.inputs.keywords && format('--keywords "{0}"', github.event.inputs.keywords) || '' }}

      - name: 寫回 data 分支
        working-directory: databr
        run: |
          git config user.name  "priceport-bot"
          git config user.email "priceport-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "價格無變動，跳過 commit"
            exit 0
          fi
          git commit -q -m "chore(${{ matrix.platform }}): 價格更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 併發推送競爭：先推，被拒再 rebase 重試，最多三次
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            echo "推送衝突，第 $i 次重試"
            git pull --rebase --autostash origin data || true
            sleep $((i * 5))
          done
          exit 1

  publish:
    needs: collect
    # 採集失敗也要部署 —— 舊資料的站台比 404 有用。
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 組合前端 + 資料
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r web/* _site/
          # 沒有這個檔，Jekyll 會把底線開頭的路徑吃掉，而且多一層建置延遲
          touch _site/.nojekyll
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data:refs/remotes/origin/data
            git worktree add databr origin/data
            cp -r databr/data _site/data
            echo "已併入 data 分支的價格資料"
          else
            echo "尚無 data 分支，只部署前端骨架"
          fi

      # 走 gh-pages 分支而不是 actions/deploy-pages。
      # deploy-pages 需要先有 Pages 站台，而建立站台要 administration 權限 ——
      # GITHUB_TOKEN 根本沒有這個 scope（可用的只有 contents / pages / id-token 等），
      # 所以 configure-pages 的 enablement 一定會回 "Resource not accessible by
      # integration"。推分支只需要 contents: write，這個權限確定拿得到。
      # 這也回到 README 原本就寫好的三分支架構：部署產物與原始碼分離。
      - name: 發佈到 gh-pages 分支
        run: |
          set -euo pipefail
          cd _site
          git init -q -b gh-pages
          git config user.name  "priceport-bot"
          git config user.email "priceport-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 每次都推一個全新的單一 commit。部署產物不需要歷史，
          # 留著只會讓 repo 一直長大。
          git push -f -q \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "已發佈 $(find . -type f -not -path './.git/*' | wc -l) 個檔案到 gh-pages"

  verify:
    # 推上 gh-pages 不等於網站是好的。Pages 可能沒開、可能建置失敗、
    # 資料路徑可能又壞掉 —— 這些都不會讓上面任何一步變紅。
    # 每一班都真的去抓一次線上網址，壞了才會有人知道。
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 確認線上網址真的活著
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          URL="https://${OWNER,,}.github.io/${REPO}/"
          # 使用者站台（repo 名就是 <帳號>.github.io）不帶子路徑
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            URL="https://${OWNER,,}.github.io/"
          fi
          echo "檢查 $URL"

          # 頁面與資料一起驗。Pages 從分支重建有延遲，最多等 5 分鐘。
          # 注意不能只 grep "PRICEPORT" —— README.md 裡也有這個字，
          # 當 Pages 服務的是 main 分支時，Jekyll 會把 README 渲染成首頁，
          # 於是回 200、也含這個字，但它根本不是應用程式。
          # 改用只有 web/index.html 才有的 DOM 標記。
          page_code=000; data_code=000
          for i in $(seq 1 20); do
            page_code=$(curl -sS -L -o page.html -w '%{http_code}' "$URL" || echo 000)
            data_code=$(curl -sS -L -o idx.json -w '%{http_code}' "${URL}data/index.json" || echo 000)
            if [ "$page_code" = "200" ] && [ "$data_code" = "200" ]; then break; fi
            echo "  [$i] 頁面 $page_code / 資料 $data_code，15 秒後重試"
            sleep 15
          done

          is_app=no
          grep -q 'id="strap"' page.html && grep -q 'id="out"' page.html && is_app=yes

          if [ "$page_code" != "200" ]; then
            echo "::error::網站沒有回應 200（最後一次 $page_code）。"
            echo "::error::到 Settings → Pages，Source 選 Deploy from a branch，分支 gh-pages、目錄 / (root)。"
            exit 1
          fi
          if [ "$is_app" = "no" ]; then
            echo "::error::網址回應 200，但服務的不是比價通的前端。"
            echo "::error::最可能的原因：Pages 的 Source 指向了 main 分支 —— main 的根目錄沒有"
            echo "::error::index.html，Jekyll 會改把 README.md 渲染成首頁，看起來像成功了。"
            echo "::error::請改成 Deploy from a branch → 分支 gh-pages、目錄 / (root)。"
            echo "--- 實際收到的前 300 字元 ---"; head -c 300 page.html; echo
            exit 1
          fi
          if [ "$data_code" != "200" ]; then
            echo "::error::前端出得來，但 data/index.json 回 $data_code —— 畫面會是一片空白。"
            echo "::error::確認 Pages 的 Source 是 gh-pages 分支（資料只存在於該分支）。"
            exit 1
          fi

          python3 - <<'PY'
          import json
          d = json.load(open("idx.json"))
          assert d.get("products", 0) > 0, f"線上沒有任何商品：{d}"
          assert d.get("platforms"), f"線上沒有任何通路：{d}"
          print(f"線上資料：{d['products']} 件商品 / "
                f"通路 {','.join(d['platforms'])} / 更新於 {d['updated_at']}")
          PY
          echo "網站正常：$URL"
